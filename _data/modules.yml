# ==========================================================
#  The 8 modules of the course (2027 Modernized Edition).
#  `number` must match the `module` field of the labs in _data/labs.yml
# ==========================================================

- number: 1
  title: Foundations
  overview: >-
    Foundational principles of deep neural network (DNN) training, loss landscapes,
    and establishing robust model baselines in PyTorch.

- number: 2
  title: Input Manipulation
  overview: >-
    Evasion attacks at inference time (FGSM, PGD) evaluated using bare-metal
    PyTorch hooks and benchmarked with Foolbox and the Adversarial Robustness Toolbox (ART).

- number: 3
  title: Poisoning & Supply Chain
  overview: >-
    Manipulating training datasets and pre-trained checkpoints through label flipping,
    clean-label backdoors, and model trojans, alongside certified detection methods.

- number: 4
  title: Availability & Resource Exhaustion
  overview: >-
    Sponge attacks and latency inflation designed to exhaust computational and energy
    resources in deployed edge and cloud models, paired with saturation defenses.

- number: 5
  title: Confidentiality & Privacy Auditing
  overview: >-
    Auditing training data leakage via Membership Inference Attacks (MIA) using ART,
    as well as model inversion and feature reconstruction threats under GDPR constraints.

- number: 6
  title: Synthetic Data Generation
  overview: >-
    Privacy-preserving synthetic tabular data generation using Variational Autoencoders (VAEs)
    and Generative Adversarial Networks (GANs/CTGAN) to share data safely.

- number: 7
  title: Provable Defenses
  overview: >-
    Formal privacy guarantees via Differential Privacy (DP-SGD) with Meta's Opacus library,
    combined with Federated Learning and adversarial robust training.

- number: 8
  title: GenAI & LLM Security
  overview: >-
    Security risks in Large Language Models and Foundation Models, including indirect
    prompt injection, automated jailbreaking (GCG), safety alignment auditing, and RAG poisoning.