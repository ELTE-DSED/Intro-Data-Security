# ==========================================================
#  Dated course events (milestones, exams, holidays).
#
#  Fields
#    id          stable identifier
#    type        raw_event
#    date        when it happens, with an explicit UTC offset
#    description what the Schedule and the Updates box show
#    name        row label (Evaluation, Holiday, etc.)
#    hide_time   omit the clock time from the Schedule
#    hide_from_announcements  keep it off the home-page Updates box
#    content     detailed description on the Schedule page
# ==========================================================

