# ==========================================================
#  Dated course events, in one place.
#
#  These used to be fifteen files in a Jekyll collection (`_events/*.md`),
#  but they are pure data: nothing renders an event as a page, and only
#  `description`, `date` and the optional `content` are ever read.
#
#  type: due        a graded deadline. "Due" rows on the Schedule.
#                  `lab` names the entry in _data/labs.yml it belongs to.
#                  The description automatically defaults to
#                  "Lab <number>: <title>" from _data/labs.yml.
#  type: raw_event  anything else (holidays, presentations).
#
#  Fields
#    id          stable identifier, not currently rendered
#    type        due | raw_event
#    date        when it happens, with an explicit UTC offset (see the note
#                on offsets in _data/labs.yml)
#    lab         due only: id of the lab in _data/labs.yml
#    description optional for due (defaults to lab title); required for raw_event
#    name        row label for raw_event (defaults to nothing)
#    hide_time   raw_event only: omit the clock time from the Schedule
#    hide_from_announcements  keep it off the home-page Updates box
#    content     raw_event only: the Course Material column
# ==========================================================

