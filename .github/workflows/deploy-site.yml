name: deploy site

on:
  push:
    branches: [main]
  # Allows a rebuild from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: write

# Only one deploy at a time; a newer push cancels an in-flight one.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Publish to gh-pages
        env:
          # Set explicitly rather than relying on the ambient GITHUB_TOKEN. An
          # unset token expands the push URL to "x-access-token:@github.com",
          # which GitHub rejects with "Invalid username or token. Password
          # authentication is not supported" -- an error that points at nothing
          # useful. Fail early with a message that names the real cause.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The site is a plain static bundle, so the branch is replaced
          # wholesale rather than merged. This keeps deploys reproducible.
          cd _site

          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN is empty in this step, so the push cannot authenticate."
            echo "::error::Check that the repository's Actions workflow permissions are set to"
            echo "::error::'Read and write permissions' (Settings -> Actions -> General ->"
            echo "::error::Workflow permissions), and that no repository variable or"
            echo "::error::environment named GITHUB_TOKEN shadows the automatic one."
            exit 1
          fi
          echo "GITHUB_TOKEN is present (${#GITHUB_TOKEN} characters)"

          # Tell GitHub Pages to serve this branch as-is. Without it, Pages
          # runs its own Jekyll build over the branch using its own defaults
          # rather than ours -- and Jekyll ignores underscore-prefixed
          # directories unless they are listed in `include`. Our _config.yml
          # does list them, but that config is not the one Pages would use, so
          # _css/ and _images/ would be dropped and the published site would
          # have no stylesheet, no logo and no staff photos.
          #
          # Note this is a Pages-side behaviour and cannot be reproduced with a
          # local `jekyll build`, which ignores .nojekyll entirely.
          touch .nojekyll

          git init -q
          git checkout -q -b gh-pages
          git add -A --force
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7